<!DOCTYPE html>
<html lang="en" data-accept-lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Papers</title>
  <style>
    :root, html[data-theme="light"] {
      --bg: #f5f6f8;
      --card: #ffffff;
      --ink: #1b2430;
      --muted: #536270;
      --line: #d5dde6;
      --accent: #0b63ce;
      --ok: #157a42;
      --bad: #b42318;
      --warn: #9a6700;
      --btn: #eef2f6;
      --tag: #e7f3ea;
      --tag-ink: #1b6b3a;
      --input: #ffffff;
      --focus: #0b63ce;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
    }
    html[data-theme="dark"] {
      --bg: #0f1419;
      --card: #1a2332;
      --ink: #e8eef6;
      --muted: #8b9bb0;
      --line: #2a3a4f;
      --accent: #4ea1ff;
      --ok: #3dcc8a;
      --bad: #f07178;
      --warn: #f0b429;
      --btn: #243044;
      --tag: #243a28;
      --tag-ink: #9ad4a0;
      --input: #0d1218;
      --focus: #4ea1ff;
      --shadow: none;
    }
    html:not([data-i18n-ready]) body { visibility: hidden; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 18px 0;
      flex-wrap: wrap;
    }
    .lang-switch, .theme-switch { display: flex; gap: 4px; }
    .lang-switch button.active, .theme-switch button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    html[data-theme="light"] .lang-switch button.active,
    html[data-theme="light"] .theme-switch button.active {
      background: #0b63ce;
    }
    main { max-width: 960px; margin: 0 auto; padding: 12px 18px 48px; }
    h1 { font-size: 1.45rem; margin: 0 0 6px; }
    h2 { font-size: 1.05rem; margin: 0 0 10px; }
    p.lead { color: var(--muted); margin: 0 0 18px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    input[type="search"], input[type="text"], input[type="password"], input[type="number"], select {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--input);
      color: var(--ink);
      font: inherit;
    }
    input[type="search"] { flex: 1 1 260px; min-width: 180px; }
    select#sort { flex: 0 1 auto; }
    input:focus, select:focus, button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    button {
      background: var(--btn);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    button.primary { background: #0b63ce; border-color: #0b63ce; color: #fff; }
    html[data-theme="dark"] button.primary { background: #1d4e89; border-color: #2d6cb5; }
    button:disabled { opacity: 0.45; cursor: default; }
    a.btn {
      display: inline-block;
      background: var(--btn);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      text-decoration: none;
      font-size: 13px;
    }
    a.btn.primary { background: #0b63ce; border-color: #0b63ce; color: #fff; }
    html[data-theme="dark"] a.btn.primary { background: #1d4e89; border-color: #2d6cb5; }
    a.btn:hover { filter: brightness(0.97); }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    article.paper {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    article.paper h2 { font-size: 1.05rem; margin: 0 0 8px; line-height: 1.35; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .year, .status-pill {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .status-pill.queued { color: var(--warn); border-color: var(--warn); }
    .status-pill.running { color: var(--accent); border-color: var(--accent); }
    .status-pill.failed { color: var(--bad); border-color: var(--bad); }
    .status-pill.done { color: var(--ok); border-color: var(--ok); }
    .tag {
      font-size: 12px;
      background: var(--tag);
      color: var(--tag-ink);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .brief { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #status { min-height: 1.3em; color: var(--muted); font-size: 13px; margin: 8px 0; }
    #xlate-banner {
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 14px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #b6d4fe;
      background: #eef5ff;
      color: #0b3d7a;
      font-size: 14px;
      box-shadow: var(--shadow);
    }
    html[data-theme="dark"] #xlate-banner {
      border-color: #2d6cb5;
      background: #1a2a40;
      color: #cfe3ff;
    }
    #xlate-banner.active { display: flex; }
    #xlate-banner .pulse {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(11, 99, 206, 0.45);
      animation: xlate-pulse 1.4s ease-out infinite;
    }
    @keyframes xlate-pulse {
      0% { box-shadow: 0 0 0 0 rgba(11, 99, 206, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(11, 99, 206, 0); }
      100% { box-shadow: 0 0 0 0 rgba(11, 99, 206, 0); }
    }
    #xlate-banner .banner-body { flex: 1 1 auto; min-width: 0; }
    #xlate-banner .banner-title { font-weight: 600; margin: 0 0 2px; }
    #xlate-banner .banner-detail {
      margin: 0;
      color: inherit;
      opacity: 0.88;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #xlate-banner .banner-meta {
      flex: 0 0 auto;
      font-size: 12px;
      opacity: 0.75;
      white-space: nowrap;
      margin-top: 2px;
    }
    #status.err { color: var(--bad); }
    #status.ok { color: var(--ok); }
    .empty { color: var(--muted); padding: 24px 0; }
    .nav a, .hint-line a { color: var(--accent); text-decoration: none; font-size: 13px; }
    .hint-line { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .hint-line a { font-size: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .pager {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 14px;
      padding: 8px 0;
    }
    .pager.visible { display: flex; }
    .pager.bottom { margin: 16px 0 0; }
    .pager-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pager-info { color: var(--muted); font-size: 13px; }
    .authors { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  </style>
  <script>
  (function () {
    var LANG_KEY = "rs_settings_lang";
    var THEME_KEY = "rs_papers_theme";
    var lang = "";
    try { lang = localStorage.getItem(LANG_KEY) || ""; } catch (e) {}
    if (lang !== "zh" && lang !== "en") {
      var nav = String(navigator.language || navigator.userLanguage || "").toLowerCase();
      var acc = document.documentElement.getAttribute("data-accept-lang") || "";
      lang = (nav.indexOf("zh") === 0 || acc.indexOf("zh") === 0) ? "zh" : "en";
    }
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.documentElement.setAttribute("data-lang", lang);
    var theme = "light";
    try { theme = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
    if (theme !== "dark") theme = "light";
    document.documentElement.setAttribute("data-theme", theme);
  })();
  </script>
</head>
<body>
<div class="top">
  <div class="nav">
    <a id="settings-link" href="/settings" data-i18n="settingsLink">Settings</a>
  </div>
  <div class="row" style="margin:0">
    <div class="theme-switch" role="group" data-i18n-aria="themeLabel" aria-label="Theme">
      <button type="button" id="theme-light" data-theme="light">Aa</button>
      <button type="button" id="theme-dark" data-theme="dark">◐</button>
    </div>
    <div class="lang-switch" role="group" data-i18n-aria="langLabel" aria-label="Language">
      <button type="button" id="lang-zh" data-lang="zh">中文</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
  </div>
</div>
<main>
  <h1 data-i18n="heading">Agent papers</h1>
  <p class="lead" data-i18n="lead">Browse the local catalog, download cached PDFs, and queue Chinese translations.</p>

  <p class="hint-line">
    <span data-i18n="llmSettingsHint">Translation LLM — configure in </span><a id="llm-settings-link" href="/settings" data-i18n="llmSettingsLink">Settings</a><span data-i18n="llmSettingsHintAfter"></span>
  </p>

  <div class="toolbar">
    <input id="q" type="search" data-i18n-placeholder="searchPh" placeholder="Search title, authors, abstract, tags…" autocomplete="off">
    <select id="tag">
      <option value="" data-i18n="tagAll">All tags</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="date-desc" data-i18n="sortNewest">Newest first</option>
      <option value="date-asc" data-i18n="sortOldest">Oldest first</option>
    </select>
    <button type="button" class="primary" id="apply" data-i18n="apply">Filter</button>
    <button type="button" id="xlate-pending" data-i18n="xlatePending">Translate pending</button>
  </div>
  <p class="meta" id="meta"></p>
  <div id="xlate-banner" role="status" aria-live="polite" hidden>
    <span class="pulse" aria-hidden="true"></span>
    <div class="banner-body">
      <p class="banner-title" id="xlate-banner-title"></p>
      <p class="banner-detail" id="xlate-banner-detail"></p>
    </div>
    <span class="banner-meta" id="xlate-banner-meta"></span>
  </div>
  <p id="status"></p>
  <div class="pager" id="pager-top">
    <span class="pager-info" id="pager-top-info"></span>
    <div class="pager-controls">
      <button type="button" class="pager-prev" data-i18n="prev">Previous</button>
      <button type="button" class="pager-next" data-i18n="next">Next</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="pager bottom" id="pager-bottom">
    <span class="pager-info" id="pager-bottom-info"></span>
    <div class="pager-controls">
      <button type="button" class="pager-prev" data-i18n="prev">Previous</button>
      <button type="button" class="pager-next" data-i18n="next">Next</button>
    </div>
  </div>
</main>
<script>
(function () {
  const LANG_KEY = "rs_settings_lang";
  const THEME_KEY = "rs_papers_theme";
  const PAGE_SIZE = 25;
  const I18N = {
    en: {
      langLabel: "Language",
      themeLabel: "Theme",
      heading: "Agent papers",
      lead: "Browse the local catalog, download cached PDFs, and queue Chinese translations.",
      settingsLink: "Settings",
      searchPh: "Search title, authors, abstract, tags…",
      tagAll: "All tags",
      apply: "Filter",
      sortNewest: "Newest first",
      sortOldest: "Oldest first",
      meta: "{matched} match · {total} in catalog · page {page}/{pages} · generated {when}",
      pageInfo: "Showing {from}–{to} of {matched}",
      prev: "Previous",
      next: "Next",
      empty: "No papers match.",
      download: "Download PDF",
      view: "Open PDF",
      arxiv: "arXiv",
      noLocal: "No local PDF",
      loadErr: "Failed to load catalog",
      unauthorized: "Unauthorized — sign in via Settings first.",
      llmSettingsHint: "Translation LLM — configure in ",
      llmSettingsLink: "Settings",
      llmSettingsHintAfter: "",
      zh: "中文版",
      dual: "中英对照",
      queued: "Queued",
      running: "Translating…",
      failed: "Failed",
      xlate: "Translate",
      xlatePending: "Translate pending",
      queuedOk: "Queued {n} paper(s).",
      queueFail: "Could not queue translation.",
      xlateBanner: "Translation in progress: {queued} queued / {running} translating",
      xlateBannerTitle: "Currently translating",
      xlatePolling: "Auto-refreshing…"
    },
    zh: {
      langLabel: "语言",
      themeLabel: "主题",
      heading: "Agent 论文库",
      lead: "浏览本地目录、下载已缓存 PDF，并排队生成中文翻译。",
      settingsLink: "设置",
      searchPh: "搜索标题、作者、摘要、标签…",
      tagAll: "全部标签",
      apply: "筛选",
      sortNewest: "最新优先",
      sortOldest: "最早优先",
      meta: "匹配 {matched} 篇 · 目录共 {total} 篇 · 第 {page}/{pages} 页 · 生成于 {when}",
      pageInfo: "显示第 {from}–{to} 篇，共 {matched} 篇",
      prev: "上一页",
      next: "下一页",
      empty: "没有匹配的论文。",
      download: "下载 PDF",
      view: "打开 PDF",
      arxiv: "arXiv",
      noLocal: "无本地 PDF",
      loadErr: "加载目录失败",
      unauthorized: "未授权 — 请先在设置页登录。",
      llmSettingsHint: "翻译 LLM 请到「",
      llmSettingsLink: "设置",
      llmSettingsHintAfter: "」配置",
      zh: "中文版",
      dual: "中英对照",
      queued: "排队中",
      running: "翻译中…",
      failed: "失败",
      xlate: "翻译",
      xlatePending: "翻译待处理",
      queuedOk: "已排队 {n} 篇。",
      queueFail: "无法加入翻译队列。",
      xlateBanner: "翻译进行中：{queued} 排队 / {running} 翻译中",
      xlateBannerTitle: "正在翻译",
      xlatePolling: "自动刷新中…"
    }
  };

  function currentLang() {
    return document.documentElement.getAttribute("data-lang") === "zh" ? "zh" : "en";
  }
  function t(k) {
    const lang = currentLang();
    return (I18N[lang] && I18N[lang][k]) || (I18N.en[k] || k);
  }
  function applyI18n() {
    const lang = currentLang();
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      const k = el.getAttribute("data-i18n");
      if (k) el.textContent = t(k);
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
      const k = el.getAttribute("data-i18n-placeholder");
      if (k) el.setAttribute("placeholder", t(k));
    });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
      const k = el.getAttribute("data-i18n-aria");
      if (k) el.setAttribute("aria-label", t(k));
    });
    // Re-apply sort option labels (select options use data-i18n).
    const sort = document.getElementById("sort");
    if (sort) {
      Array.prototype.forEach.call(sort.options, function (opt) {
        const k = opt.getAttribute("data-i18n");
        if (k) opt.textContent = t(k);
      });
    }
    document.getElementById("lang-zh").classList.toggle("active", lang === "zh");
    document.getElementById("lang-en").classList.toggle("active", lang === "en");
    const theme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    document.getElementById("theme-light").classList.toggle("active", theme === "light");
    document.getElementById("theme-dark").classList.toggle("active", theme === "dark");
    document.documentElement.setAttribute("data-i18n-ready", "1");
  }
  function setLang(lang) {
    if (lang !== "zh" && lang !== "en") lang = "en";
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.documentElement.setAttribute("data-lang", lang);
    applyI18n();
    renderAll();
  }
  function setTheme(theme) {
    if (theme !== "dark") theme = "light";
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    document.documentElement.setAttribute("data-theme", theme);
    applyI18n();
  }

  function appPrefix() {
    let p = location.pathname || "";
    const markers = ["/papers", "/settings", "/search", "/download"];
    for (let i = 0; i < markers.length; i++) {
      const m = markers[i];
      const idx = p.indexOf(m);
      if (idx >= 0) return p.slice(0, idx);
    }
    return "";
  }
  const prefix = appPrefix();
  const urlToken = new URLSearchParams(location.search).get("token") || "";
  document.getElementById("settings-link").href = withToken(prefix + "/settings");
  document.getElementById("llm-settings-link").href = withToken(prefix + "/settings");

  function withToken(u) {
    if (!urlToken) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "token=" + encodeURIComponent(urlToken);
  }
  function authHeaders(json) {
    const h = {};
    if (json) h["Content-Type"] = "application/json";
    if (urlToken) h["Authorization"] = "Bearer " + urlToken;
    return h;
  }
  function apiURL() {
    return prefix + "/papers/api";
  }
  function pdfURL(localPath, download) {
    let u = prefix + localPath;
    if (download) u += (u.indexOf("?") >= 0 ? "&" : "?") + "download=1";
    return withToken(u);
  }

  let lastCatalog = { count: 0, papers: [], generated_at: "", translate_progress: null };
  let filteredPapers = [];
  let pageIndex = 1; // 1-based
  let pollTimer = 0;
  const POLL_ACTIVE_MS = 4000;
  const POLL_IDLE_MS = 30000;
  let idlePoll = false;
  let searchTimer = 0;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function paperDateKey(p) {
    const pub = String(p.published || "").trim();
    if (pub) return pub;
    const y = Number(p.year) || 0;
    if (y > 0) return String(y).padStart(4, "0") + "-01-01T00:00:00Z";
    return "";
  }

  function matchesQuery(p, q) {
    if (!q) return true;
    const blob = [
      p.title,
      p.brief,
      p.abstract,
      p.arxiv_id,
      p.id,
      p.filename,
      (p.authors || []).join(" "),
      (p.topic_tags || []).join(" ")
    ].join(" ").toLowerCase();
    return blob.indexOf(q) >= 0;
  }

  function applyFilters(resetPage) {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const tag = document.getElementById("tag").value;
    const sort = document.getElementById("sort").value || "date-desc";
    let list = (lastCatalog.papers || []).slice();
    if (tag) {
      const tagL = tag.toLowerCase();
      list = list.filter(function (p) {
        return (p.topic_tags || []).some(function (tg) {
          return String(tg).toLowerCase() === tagL;
        });
      });
    }
    if (q) {
      list = list.filter(function (p) { return matchesQuery(p, q); });
    }
    list.sort(function (a, b) {
      const ka = paperDateKey(a);
      const kb = paperDateKey(b);
      if (ka !== kb) {
        if (sort === "date-asc") return ka < kb ? -1 : 1;
        return ka > kb ? -1 : 1;
      }
      const ta = String(a.title || "").toLowerCase();
      const tb = String(b.title || "").toLowerCase();
      return ta < tb ? -1 : ta > tb ? 1 : 0;
    });
    filteredPapers = list;
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE) || 1);
    if (resetPage) pageIndex = 1;
    if (pageIndex > pages) pageIndex = pages;
    if (pageIndex < 1) pageIndex = 1;
  }

  function progressFromCatalog(cat) {
    const p = (cat && cat.translate_progress) || null;
    if (p && typeof p === "object") {
      return {
        queued: Number(p.queued) || 0,
        running: Number(p.running) || 0,
        active: !!p.active,
        running_id: p.running_id || "",
        running_title: p.running_title || ""
      };
    }
    let queued = 0, running = 0, runningTitle = "", runningId = "";
    ((cat && cat.papers) || []).forEach(function (paper) {
      const st = paper.translate_status || "";
      if (st === "queued") queued++;
      if (st === "running") {
        running++;
        if (!runningId) {
          runningId = paper.id || "";
          runningTitle = paper.title || "";
        }
      }
    });
    return {
      queued: queued,
      running: running,
      active: queued > 0 || running > 0,
      running_id: runningId,
      running_title: runningTitle
    };
  }

  function renderTranslateBanner() {
    const banner = document.getElementById("xlate-banner");
    const titleEl = document.getElementById("xlate-banner-title");
    const detailEl = document.getElementById("xlate-banner-detail");
    const metaEl = document.getElementById("xlate-banner-meta");
    const prog = progressFromCatalog(lastCatalog);
    if (!prog.active) {
      banner.classList.remove("active");
      banner.hidden = true;
      titleEl.textContent = "";
      detailEl.textContent = "";
      metaEl.textContent = "";
      return prog;
    }
    banner.hidden = false;
    banner.classList.add("active");
    titleEl.textContent = t("xlateBanner")
      .replace("{queued}", String(prog.queued))
      .replace("{running}", String(prog.running));
    if (prog.running_title) {
      detailEl.textContent = t("xlateBannerTitle") + "：" + prog.running_title;
      detailEl.hidden = false;
    } else if (prog.running_id) {
      detailEl.textContent = t("xlateBannerTitle") + "：" + prog.running_id;
      detailEl.hidden = false;
    } else {
      detailEl.textContent = "";
      detailEl.hidden = true;
    }
    metaEl.textContent = t("xlatePolling");
    return prog;
  }

  function syncPolling(active) {
    if (active) {
      if (pollTimer && !idlePoll) return;
      if (pollTimer) clearInterval(pollTimer);
      idlePoll = false;
      pollTimer = setInterval(function () { load({ silent: true }); }, POLL_ACTIVE_MS);
      return;
    }
    if (pollTimer && idlePoll) return;
    if (pollTimer) clearInterval(pollTimer);
    idlePoll = true;
    pollTimer = setInterval(function () { load({ silent: true }); }, POLL_IDLE_MS);
  }

  function statusLabel(st) {
    if (st === "queued") return t("queued");
    if (st === "running") return t("running");
    if (st === "failed") return t("failed");
    return "";
  }

  function renderMeta() {
    const when = lastCatalog.generated_at || "—";
    const total = typeof lastCatalog.count === "number" ? lastCatalog.count : (lastCatalog.papers || []).length;
    const matched = filteredPapers.length;
    const pages = Math.max(1, Math.ceil(matched / PAGE_SIZE) || 1);
    const text = t("meta")
      .replace("{matched}", String(matched))
      .replace("{shown}", String(matched))
      .replace("{total}", String(total))
      .replace("{page}", String(pageIndex))
      .replace("{pages}", String(pages))
      .replace("{when}", when);
    document.getElementById("meta").textContent = text;
  }

  function renderPagers() {
    const matched = filteredPapers.length;
    const pages = Math.max(1, Math.ceil(matched / PAGE_SIZE) || 1);
    const show = matched > PAGE_SIZE;
    ["pager-top", "pager-bottom"].forEach(function (id) {
      const el = document.getElementById(id);
      el.classList.toggle("visible", show);
      const prev = el.querySelector(".pager-prev");
      const next = el.querySelector(".pager-next");
      prev.disabled = pageIndex <= 1;
      next.disabled = pageIndex >= pages;
    });
    const from = matched === 0 ? 0 : (pageIndex - 1) * PAGE_SIZE + 1;
    const to = Math.min(matched, pageIndex * PAGE_SIZE);
    const info = t("pageInfo")
      .replace("{from}", String(from))
      .replace("{to}", String(to))
      .replace("{matched}", String(matched));
    document.getElementById("pager-top-info").textContent = show ? info : "";
    document.getElementById("pager-bottom-info").textContent = show ? info : "";
  }

  function renderPaperCard(p) {
    const tags = (p.topic_tags || []).map(function (tg) {
      return '<span class="tag">' + esc(tg) + "</span>";
    }).join("");
    const year = p.year ? '<span class="year">' + esc(p.year) + "</span>" : "";
    const authors = (p.authors || []).length
      ? '<p class="authors">' + esc((p.authors || []).join(", ")) + "</p>"
      : "";
    let actions = "";
    if (p.has_local && p.local_pdf) {
      actions += '<a class="btn primary" href="' + esc(pdfURL(p.local_pdf, false)) + '" target="_blank" rel="noopener">' + esc(t("view")) + "</a>";
      actions += '<a class="btn" href="' + esc(pdfURL(p.local_pdf, true)) + '">' + esc(t("download")) + "</a>";
    } else {
      actions += '<span class="year">' + esc(t("noLocal")) + "</span>";
    }
    if (p.zh_pdf) {
      actions += '<a class="btn" href="' + esc(pdfURL(p.zh_pdf, false)) + '" target="_blank" rel="noopener">' + esc(t("zh")) + "</a>";
    }
    if (p.dual_pdf) {
      actions += '<a class="btn" href="' + esc(pdfURL(p.dual_pdf, false)) + '" target="_blank" rel="noopener">' + esc(t("dual")) + "</a>";
    }
    const st = p.translate_status || "";
    if (st && st !== "done") {
      const title = p.translate_error ? ' title="' + esc(p.translate_error) + '"' : "";
      actions += '<span class="status-pill ' + esc(st) + '"' + title + ">" + esc(statusLabel(st)) + "</span>";
    }
    if (p.has_local && (!p.zh_pdf || !p.dual_pdf) && st !== "queued" && st !== "running") {
      actions += '<button type="button" class="xlate-one" data-id="' + esc(p.id || "") + '">' + esc(t("xlate")) + "</button>";
    }
    if (p.source_url) {
      actions += '<a class="btn" href="' + esc(p.source_url) + '" target="_blank" rel="noopener">' + esc(t("arxiv")) + "</a>";
    } else if (p.arxiv_id) {
      actions += '<a class="btn" href="https://arxiv.org/abs/' + esc(p.arxiv_id) + '" target="_blank" rel="noopener">' + esc(t("arxiv")) + "</a>";
    }
    const brief = p.brief || "";
    return (
      '<article class="paper">' +
        "<h2>" + esc(p.title || "") + "</h2>" +
        authors +
        '<div class="row">' + year + tags + "</div>" +
        (brief ? '<p class="brief">' + esc(brief) + "</p>" : "") +
        '<div class="actions">' + actions + "</div>" +
      "</article>"
    );
  }

  function renderList() {
    const list = document.getElementById("list");
    const start = (pageIndex - 1) * PAGE_SIZE;
    const pagePapers = filteredPapers.slice(start, start + PAGE_SIZE);
    renderMeta();
    renderPagers();
    if (!filteredPapers.length) {
      list.innerHTML = '<p class="empty">' + esc(t("empty")) + "</p>";
    } else {
      list.innerHTML = pagePapers.map(renderPaperCard).join("");
      list.querySelectorAll(".xlate-one").forEach(function (btn) {
        btn.addEventListener("click", function () {
          enqueue({ id: btn.getAttribute("data-id") || "" });
        });
      });
    }
    const prog = renderTranslateBanner();
    const anyInflight = (lastCatalog.papers || []).some(function (p) {
      const st = p.translate_status || "";
      return st === "queued" || st === "running";
    });
    syncPolling(!!(prog && prog.active) || anyInflight);
  }

  function renderAll(resetPage) {
    applyFilters(!!resetPage);
    renderList();
  }

  function fillTags(papers) {
    const sel = document.getElementById("tag");
    const cur = sel.value;
    const set = {};
    (papers || []).forEach(function (p) {
      (p.topic_tags || []).forEach(function (tg) {
        if (tg) set[tg] = true;
      });
    });
    const tags = Object.keys(set).sort();
    sel.innerHTML = '<option value="">' + esc(t("tagAll")) + "</option>" +
      tags.map(function (tg) {
        return '<option value="' + esc(tg) + '">' + esc(tg) + "</option>";
      }).join("");
    if (cur && set[cur]) sel.value = cur;
  }

  async function load(opts) {
    const silent = !!(opts && opts.silent);
    const status = document.getElementById("status");
    if (!silent) {
      status.textContent = "";
      status.className = "";
    }
    try {
      // Always fetch the full catalog so client search/sort/pagination and
      // page-level translate_progress stay accurate while jobs run.
      const res = await fetch(apiURL(), { credentials: "same-origin", headers: authHeaders(false) });
      if (res.status === 401) {
        status.textContent = t("unauthorized");
        status.className = "err";
        location.href = withToken(prefix + "/settings");
        return;
      }
      if (!res.ok) {
        status.textContent = t("loadErr") + " (" + res.status + ")";
        status.className = "err";
        return;
      }
      const data = await res.json();
      fillTags(data.papers || []);
      lastCatalog = data;
      renderAll(false);
    } catch (e) {
      if (!silent) {
        status.textContent = String(e);
        status.className = "err";
      }
    }
  }

  async function enqueue(payload) {
    const status = document.getElementById("status");
    try {
      const res = await fetch(prefix + "/papers/translate", {
        method: "POST",
        credentials: "same-origin",
        headers: authHeaders(true),
        body: JSON.stringify(payload || { all: true })
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.ok) {
        status.textContent = t("queueFail");
        status.className = "err";
        return;
      }
      const n = (data.queued || []).length;
      status.textContent = t("queuedOk").replace("{n}", String(n));
      status.className = n ? "ok" : "";
      load();
    } catch (e) {
      status.textContent = String(e);
      status.className = "err";
    }
  }

  function goPage(delta) {
    const pages = Math.max(1, Math.ceil(filteredPapers.length / PAGE_SIZE) || 1);
    pageIndex = Math.min(pages, Math.max(1, pageIndex + delta));
    renderList();
    try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); }
  }

  document.getElementById("lang-zh").addEventListener("click", function () { setLang("zh"); });
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
  document.getElementById("theme-light").addEventListener("click", function () { setTheme("light"); });
  document.getElementById("theme-dark").addEventListener("click", function () { setTheme("dark"); });
  document.getElementById("apply").addEventListener("click", function () { renderAll(true); });
  document.getElementById("xlate-pending").addEventListener("click", function () { enqueue({ all: true }); });
  document.getElementById("q").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); renderAll(true); }
  });
  document.getElementById("q").addEventListener("input", function () {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { renderAll(true); }, 220);
  });
  document.getElementById("tag").addEventListener("change", function () { renderAll(true); });
  document.getElementById("sort").addEventListener("change", function () { renderAll(true); });
  document.querySelectorAll(".pager-prev").forEach(function (btn) {
    btn.addEventListener("click", function () { goPage(-1); });
  });
  document.querySelectorAll(".pager-next").forEach(function (btn) {
    btn.addEventListener("click", function () { goPage(1); });
  });
  applyI18n();
  load();
})();
</script>
</body>
</html>
